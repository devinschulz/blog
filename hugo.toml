baseURL = "https://devinschulz.com/"
publishDir = "dist"
locale = "en-CA"
title = "Devin Schulz"
enableRobotsTXT = true
enableGitInfo = true

[taxonomies]
tag = "tags"

[params]
email = "hello@devinschulz.com"
github = "https://github.com/devinschulz"
linkedin = "https://www.linkedin.com/in/devinschulz/"
role = "Senior Frontend Engineer"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[permalinks]
blog = "/blog/:slug/"

[outputFormats.llms]
mediaType = 'text/plain'
baseName = 'llms'
isPlainText = true

[outputFormats.md]
mediaType = 'text/markdown'
baseName = 'index'
isPlainText = true

[outputFormats.search]
mediaType = 'application/json'
baseName = 'search'
isPlainText = true

[outputs]
home = ['html', 'rss', 'llms', 'md', 'search']
section = ['html', 'rss', 'md']
page = ['html', 'md']
taxonomy = ['html', 'md']
term = ['html', 'md']

[build.buildStats]
enable = true

[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

[[module.mounts]]
source = 'assets'
target = 'assets'

[[module.mounts]]
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'
disableWatch = true

[security.exec]
allow = ['^go$', '^git$', '^node$', '^tailwindcss$']
