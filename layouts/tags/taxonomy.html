{{ define "main" }}
  <section class="reading-shell pb-8" aria-labelledby="archive-title">
    <header class="archive-hero mb-6">
      <a class="mb-5 inline-flex min-h-11 items-center text-sm text-accent underline underline-offset-4" href="{{ "blog/" | relURL }}">All writing</a>
      <h1 id="archive-title" class="text-xl font-medium tracking-[-0.02em]">Browse writing by tag</h1>
    </header>
    <nav aria-label="Writing tags">
      <ul>
        {{ range .Data.Terms.Alphabetical }}
        {{ $posts := where .Page.RegularPages "Section" "blog" }}
        <li><a class="flex min-h-11 items-baseline justify-between gap-5 py-2 text-base hover:underline hover:underline-offset-4" href="{{ .Page.RelPermalink }}"><span>{{ .Page.LinkTitle }}</span><span class="text-xs text-muted">{{ len $posts }} {{ if eq (len $posts) 1 }}article{{ else }}articles{{ end }}</span></a></li>
        {{ end }}
      </ul>
    </nav>
  </section>
{{ end }}
