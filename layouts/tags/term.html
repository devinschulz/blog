{{ define "main" }}
  {{ $posts := where .RegularPages "Section" "blog" }}
  <section class="reading-shell pb-8" aria-labelledby="archive-title">
    <header class="archive-hero mb-6">
      <div class="mb-5 flex flex-wrap gap-x-6 text-sm text-accent"><a class="inline-flex min-h-11 items-center underline underline-offset-4" href="{{ "blog/" | relURL }}">All writing</a><a class="inline-flex min-h-11 items-center underline underline-offset-4" href="{{ "tags/" | relURL }}">All tags</a></div>
      <h1 id="archive-title" class="text-xl font-medium tracking-[-0.02em]">{{ .LinkTitle }}</h1>
      <p class="mt-3 text-sm text-muted">{{ len $posts }} {{ if eq (len $posts) 1 }}article{{ else }}articles{{ end }} tagged {{ .LinkTitle }}.</p>
    </header>
    {{ partial "writing-list.html" (dict "posts" $posts) }}
  </section>
{{ end }}
