{{ define "main" }}
<article class="reading-shell pb-8" aria-labelledby="colophon-title">
  <header class="mb-8">
    <h1 id="colophon-title" class="text-2xl leading-snug font-medium tracking-[-0.025em]">{{ .Title }}</h1>
    <p class="mt-5 text-base leading-relaxed text-muted">{{ .Description }}</p>
  </header>
  <div class="prose prose-theme max-w-none text-base leading-[1.8] text-ink prose-headings:font-semibold prose-headings:tracking-[-0.03em] prose-headings:text-ink prose-h2:mt-12 prose-h2:text-lg prose-a:text-accent prose-a:underline-offset-4 prose-strong:text-ink">{{ .Content }}</div>
</article>
{{ end }}
