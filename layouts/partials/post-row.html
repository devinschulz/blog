<a data-archive-target="post" data-topics="{{ range .Params.tags }}{{ . | lower }}|{{ end }}" href="{{ .RelPermalink }}" class="group grid grid-cols-[3.25rem_1fr_auto] items-baseline gap-x-3 rounded-panel px-4 py-4 transition-colors duration-200 hover:bg-white/4 desktop:grid-cols-[4.5rem_1fr_auto] desktop:gap-x-5 [[hidden]]:hidden">
  <time datetime="{{ .Date.Format "2006-01-02" }}" class="font-mono text-xs text-muted">{{ .Date.Format "2006" }}</time>
  <div>
    <h3 class="display text-[1.3rem] leading-[1.12] font-medium tracking-[-0.02em] desktop:text-[1.6rem]">{{ .Title }}</h3>
    <span class="mt-1.5 block text-sm text-muted">{{ with .Params.tags }}{{ delimit . ", " }}{{ else }}Notes{{ end }}</span>
  </div>
  <b class="self-center font-normal text-accent transition-transform duration-200 ease-snappy group-hover:translate-x-0.5 group-hover:-translate-y-0.5" aria-hidden="true">↗&#xFE0E;</b>
</a>
