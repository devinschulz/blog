<a href="{{ .RelPermalink }}" class="post-row group grid grid-cols-[2.25rem_minmax(0,1fr)_1.25rem] items-baseline gap-x-3 border-t border-line py-7 last:border-b desktop:grid-cols-[minmax(4rem,0.8fr)_minmax(0,4fr)_2.75rem] desktop:gap-x-8 desktop:py-10 [[hidden]]:hidden">
  <time datetime="{{ .Date.Format "2006-01-02" }}" class="font-mono text-[10px] text-muted desktop:text-xs">{{ .Date.Format "2006" }}</time>
  <div>
    <h3 class="max-w-[36ch] text-[22px] leading-[1.16] font-normal tracking-[-0.04em] group-hover:text-accent group-hover:underline group-hover:decoration-1 group-hover:underline-offset-[5px] desktop:text-[clamp(28px,2.8vw,44px)]">{{ .Title }}</h3>
    <span class="mt-3 block text-xs leading-relaxed text-muted desktop:mt-4 desktop:text-sm">{{ with .Params.tags }}{{ delimit . ", " }}{{ else }}Notes{{ end }}</span>
  </div>
  <span class="self-start text-right text-xl leading-normal group-hover:text-accent desktop:text-[28px] motion-safe:transition-transform motion-safe:duration-200 motion-safe:ease-snappy motion-safe:group-hover:translate-x-0.5 motion-safe:group-hover:-translate-y-0.5" aria-hidden="true">↗&#xFE0E;</span>
</a>
