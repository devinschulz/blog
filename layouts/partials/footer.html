  <div data-reveal class="shell">
    <div class="core px-5 py-10 desktop:px-14 desktop:py-20">
      <p class="label">Have an interface that needs care?</p>
      <a class="display mt-5 inline-block text-[clamp(1.25rem,6.6vw,2.5rem)] tracking-[-0.04em] underline decoration-line-strong decoration-2 underline-offset-[0.18em] transition-colors duration-200 hover:decoration-accent desktop:text-[clamp(2.5rem,5vw,4.5rem)]" href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
    </div>
  </div>
  <div class="mt-6 grid gap-4 px-2 text-sm text-muted desktop:grid-cols-[1fr_auto] desktop:items-center">
    <p>Devin Schulz, {{ site.Params.role }} at Stripe. © {{ now.Year }}</p>
    <ul class="-ml-2 flex flex-wrap gap-1 [&_a]:inline-flex [&_a]:min-h-11 [&_a]:items-center [&_a]:px-2 [&_a]:transition-colors [&_a]:duration-200 [&_a:hover]:text-ink desktop:-mr-2 desktop:ml-0">
      <li><a href="{{ site.Params.github }}">GitHub</a></li>
      <li><a href="{{ site.Params.linkedin }}">LinkedIn</a></li>
    </ul>
  </div>
</footer>
