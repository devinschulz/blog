<footer class="site-footer mx-auto mt-8 w-[calc(100%-40px)] max-w-[1200px] border-t border-line-strong py-8 text-sm text-muted desktop:mt-12 desktop:w-[calc(100%-96px)] desktop:py-10" id="contact">
  <div class="flex flex-col gap-6 desktop:flex-row desktop:items-start desktop:justify-between desktop:gap-10">
    <p class="shrink-0">© {{ now.Year }} Devin Schulz</p>
    <nav aria-label="Footer navigation">
      <ul class="flex flex-wrap gap-x-6 gap-y-1 desktop:justify-end">
        <li><a class="inline-flex min-h-11 items-center underline-offset-4 hover:text-ink hover:underline" href="{{ "blog/" | relURL }}">Writing</a></li>
        <li><a class="inline-flex min-h-11 items-center underline-offset-4 hover:text-ink hover:underline" href="{{ "tags/" | relURL }}">Topics</a></li>
        {{ with site.Home.OutputFormats.Get "RSS" }}<li><a class="inline-flex min-h-11 items-center underline-offset-4 hover:text-ink hover:underline" href="{{ .RelPermalink }}">RSS</a></li>{{ end }}
        <li><a class="inline-flex min-h-11 items-center underline-offset-4 hover:text-ink hover:underline" href="{{ "colophon/" | relURL }}">Colophon</a></li>
        <li><a class="inline-flex min-h-11 items-center underline-offset-4 hover:text-ink hover:underline" href="{{ site.Params.github }}">GitHub</a></li>
        <li><a class="inline-flex min-h-11 items-center underline-offset-4 hover:text-ink hover:underline" href="mailto:{{ site.Params.email }}">Email</a></li>
      </ul>
    </nav>
  </div>
  <div class="mt-3 flex flex-wrap items-center justify-between gap-x-6 gap-y-1 text-xs">
    <p>This is my own site. Views are my own.</p>
    <div class="flex items-center gap-6">
      <button hidden data-fish-toggle type="button" class="inline-flex min-h-11 items-center underline-offset-4 hover:text-ink hover:underline [[hidden]]:hidden">Pause fish</button>
      <a class="inline-flex min-h-11 items-center gap-2 underline-offset-4 hover:text-ink hover:underline" href="#page-top">Back to top {{ partial "arrow-icon.html" (dict "direction" "up" "class" "h-4 w-4") }}</a>
    </div>
  </div>
</footer>
