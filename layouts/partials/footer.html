<footer class="site-footer relative isolate [container-type:inline-size] m-2 overflow-clip rounded-[18px] bg-[#2449ef] px-5 pt-8 pb-3 text-white desktop:m-4 desktop:rounded-3xl desktop:px-8 desktop:pt-14 forced-colors:border forced-colors:border-[CanvasText] [&_:focus-visible]:outline-white [&_:focus-visible]:ring-[#2449ef]" id="contact">
  <div class="footer-top">
    <p class="relative z-3 text-xs desktop:text-sm">Have something in mind?</p>
    <a class="relative z-3 mt-10 mb-3 flex flex-wrap items-center justify-between gap-x-4 gap-y-[0.2em] text-[clamp(2.5rem,13cqw,13.75rem)] leading-[1.2] tracking-[-0.075em] select-none hover:underline hover:decoration-2 hover:underline-offset-[12px] desktop:mt-12 desktop:text-[clamp(2.5rem,13cqw,13.75rem)] [&.is-spatial]:text-transparent forced-colors:[&.is-spatial]:text-[CanvasText]" href="mailto:{{ site.Params.email }}"><span class="min-w-0">LET’S TALK</span><span class="shrink-0 text-[0.8em]" aria-hidden="true">↗&#xFE0E;</span></a>
    <span class="footer-email relative z-3 block pb-10 text-xs desktop:pb-16 desktop:text-sm">{{ site.Params.email }}</span>
  </div>
  <div class="footer-bottom relative z-3 items-center justify-between gap-6 border-t border-white/33 pt-5 pb-2 text-[11px] desktop:flex desktop:pt-2">
    <p>© {{ now.Year }} Devin Schulz</p>
    <p class="personal-note hidden max-w-65 text-[10px] leading-normal min-[1100px]:block">This is my own site. Views on my work are my own.</p>
    <ul class="mt-2 flex flex-wrap gap-5 desktop:mt-0 desktop:flex-nowrap desktop:gap-7">
      <li><a class="inline-flex min-h-11 items-center" href="{{ site.Params.github }}">GitHub ↗&#xFE0E;</a></li>
      <li><a class="inline-flex min-h-11 items-center" href="{{ site.Params.linkedin }}">LinkedIn ↗&#xFE0E;</a></li>
      <li><a class="inline-flex min-h-11 items-center" href="#page-top">Back to top ↑&#xFE0E;</a></li>
    </ul>
  </div>
</footer>
