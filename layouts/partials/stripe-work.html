{{ with hugo.Data.experience.stripe }}
<article id="stripe" aria-labelledby="stripe-title" class="mt-7 scroll-mt-8">
  <h3 id="stripe-title" class="text-lg font-medium tracking-[-0.02em]">{{ .company }}</h3>
  <p class="mt-2 text-xs text-muted">{{ site.Params.role }}<br>{{ .period }}</p>
  <p class="mt-4 text-base leading-[1.75]">{{ .summary }}</p>
  <ol class="mt-3" aria-label="Work at Stripe, in order">
    {{ range .projects }}
    <li class="flex items-baseline justify-between gap-4">
      <a class="inline-flex min-h-11 items-center text-base text-accent underline underline-offset-4" href="{{ .url }}">{{ .name }}</a>
      <span class="text-xs text-muted">{{ .status }}</span>
    </li>
    {{ end }}
  </ol>
</article>
{{ end }}
