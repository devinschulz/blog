{{ $image := resources.Get .image }}
{{ if not $image }}{{ errorf "Case-study image not found: %s" .image }}{{ end }}
{{ $small := $image.Resize "700x webp q85" }}
{{ $large := $image.Resize "1400x webp q90" }}
<figure>
  <a class="group block overflow-hidden rounded-panel border border-line bg-surface" href="{{ $image.RelPermalink }}" target="_blank" rel="noopener" aria-label="View full-size image: {{ .caption }} (opens in a new tab)">
    <img class="block h-auto w-full transition-transform duration-500 ease-snappy group-hover:scale-[1.012]" src="{{ $large.RelPermalink }}" srcset="{{ $small.RelPermalink }} 700w, {{ $large.RelPermalink }} 1400w" sizes="{{ .sizes | default "(min-width: 781px) 83vw, 100vw" }}" width="{{ $image.Width }}" height="{{ $image.Height }}" alt="{{ .alt }}" {{ if .eager }}loading="eager" fetchpriority="high"{{ else }}loading="lazy"{{ end }} decoding="async">
  </a>
  <figcaption class="mt-3 flex items-baseline justify-between gap-5 text-sm leading-relaxed text-muted">
    <span>{{ .caption }}</span><span aria-hidden="true" class="shrink-0 font-mono text-xs text-accent">Full size ↗&#xFE0E;</span>
  </figcaption>
</figure>
