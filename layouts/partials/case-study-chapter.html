{{ $c := .chapter }}
<section id="{{ $c.id }}" aria-labelledby="{{ $c.id }}-title" class="scroll-mt-8 py-10">
  <h2 id="{{ $c.id }}-title" class="h-section">{{ $c.title }}</h2>
  <p class="mt-5 text-base leading-[1.75]">{{ $c.description }}</p>
  <div class="mt-7">{{ partial "case-study-image.html" $c }}</div>
  {{ with $c.notes }}
  <div class="mt-7 grid gap-6">
    {{ range . }}<div><h3 class="text-base font-medium">{{ .title }}</h3><p class="mt-2 leading-[1.75]">{{ .body }}</p></div>{{ end }}
  </div>
  {{ end }}
</section>
