<header data-controller="search sticky-header" data-search-index-value="{{ (site.Home.OutputFormats.Get "search").RelPermalink }}" data-action="scroll@window->sticky-header#update:passive resize@window->sticky-header#update turbo:load@document->sticky-header#update turbo:before-cache@document->search#beforeCache keydown@document->search#keydown focusin@document->search#containFocus pointerdown@document->search#outside resize@window->search#position" class="site-header reading-shell sticky top-0 z-40 mt-10 mb-10 flex min-h-11 items-center justify-between gap-1 bg-paper py-3 max-[279px]:flex-wrap desktop:mt-32 desktop:mb-16 desktop:gap-5">
  <a class="brand inline-flex min-h-11 shrink-0 select-none items-center text-base font-normal tracking-[-0.025em] whitespace-nowrap" href="{{ site.Home.RelPermalink }}" aria-label="Devin Schulz, home">devin schulz<span class="text-accent" aria-hidden="true">.</span></a>
  <nav class="desktop-nav hidden items-center gap-8 desktop:ml-auto desktop:flex" aria-label="Main navigation">
    <a class="inline-flex min-h-11 items-center text-[13px] font-medium hover:underline {{ if or .IsHome (eq .Section "blog") (eq .Section "tags") }}underline{{ end }}" href="{{ "blog/" | relURL }}"{{ if or .IsHome (eq .Section "blog") (eq .Section "tags") }} aria-current="{{ if .IsSection }}page{{ else }}true{{ end }}"{{ end }}>Writing</a>
    <a class="inline-flex min-h-11 items-center text-[13px] font-medium hover:underline {{ if eq .Section "work" }}underline{{ end }}" href="{{ "work/" | relURL }}"{{ if eq .Section "work" }} aria-current="true"{{ end }}>Work</a>
    <a class="inline-flex min-h-11 items-center text-[13px] font-medium hover:underline {{ if eq .Type "about" }}underline{{ end }}" href="{{ "about/" | relURL }}"{{ if eq .Type "about" }} aria-current="page"{{ end }}>About</a>
  </nav>
  <div class="header-actions ml-auto flex shrink-0 items-center desktop:mx-0 desktop:gap-2">
    <button type="button" popovertarget="site-search-popover" data-search-target="trigger" data-action="search#open" aria-label="Search" title="Search" aria-controls="site-search-popover" aria-expanded="false" class="header-icon-button">{{ partial "header-icon.html" "search" }}</button>
    <span class="inline-flex h-11 w-11 shrink-0 items-center justify-center">
      <button hidden type="button" data-controller="theme" data-action="theme#toggle" aria-label="Switch color theme" class="theme-toggle header-icon-button">
        <span data-theme-icon="dark">{{ partial "header-icon.html" "moon" }}</span>
        <span data-theme-icon="light" hidden>{{ partial "header-icon.html" "sun" }}</span>
      </button>
    </span>
  </div>
  <details class="mobile-menu shrink-0 max-[279px]:ml-auto desktop:hidden" data-mobile-menu data-controller="menu" data-action="keydown@document->menu#closeOnEscape pointerdown@document->menu#closeOnOutsidePress">
    <summary class="flex min-h-11 cursor-pointer list-none items-center gap-2 pl-2 text-xs whitespace-nowrap hover:text-accent [&::-webkit-details-marker]:hidden" data-menu-target="summary">Menu {{ partial "disclosure-icon.html" . }}</summary>
    <nav class="mobile-navigation absolute inset-x-0 top-full mt-2 rounded-2xl border border-line-strong bg-paper p-6 text-ink shadow-[0_12px_24px_#0002] [&_:focus-visible]:outline-accent [&_:focus-visible]:ring-paper" aria-label="Mobile navigation">
      <a class="flex min-h-14 items-center text-[28px] font-semibold tracking-[-0.04em] {{ if or .IsHome (eq .Section "blog") (eq .Section "tags") }}underline{{ end }}" data-action="menu#follow" href="{{ "blog/" | relURL }}"{{ if or .IsHome (eq .Section "blog") (eq .Section "tags") }} aria-current="{{ if .IsSection }}page{{ else }}true{{ end }}"{{ end }}>Writing</a>
      <a class="flex min-h-14 items-center text-[28px] font-semibold tracking-[-0.04em] {{ if eq .Section "work" }}underline{{ end }}" data-action="menu#follow" href="{{ "work/" | relURL }}"{{ if eq .Section "work" }} aria-current="true"{{ end }}>Work</a>
      <a class="flex min-h-14 items-center text-[28px] font-semibold tracking-[-0.04em] {{ if eq .Type "about" }}underline{{ end }}" data-action="menu#follow" href="{{ "about/" | relURL }}"{{ if eq .Type "about" }} aria-current="page"{{ end }}>About</a>
    </nav>
  </details>
  {{ partial "search.html" . }}
</header>
