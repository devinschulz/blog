<header class="site-header z-40 flex items-center justify-between gap-3 {{ if .IsHome }}absolute inset-x-2 top-2 min-h-20 px-5 text-white desktop:inset-x-4 desktop:top-4 desktop:min-h-25 desktop:px-8 [&_:focus-visible]:outline-white [&_:focus-visible]:ring-[#2449ef]{{ else }}relative min-h-22 px-5 desktop:min-h-27 desktop:px-8 min-[1100px]:px-12{{ end }} desktop:gap-6">
  <a class="brand inline-flex min-h-11 items-center gap-1.25 text-[23px] font-semibold tracking-[-0.065em] desktop:text-[26px]" href="{{ site.Home.RelPermalink }}" aria-label="Devin Schulz, home">devin schulz<span class="text-[26px] {{ if .IsHome }}text-white{{ else }}text-accent{{ end }}" aria-hidden="true">.</span></a>
  {{ if .IsHome }}
  <button hidden data-wave-trigger type="button" aria-pressed="false" aria-describedby="wave-help" class="absolute top-20 left-5 inline-flex min-h-11 items-center gap-2 rounded-full border border-white/50 bg-white/10 px-3 text-[11px] whitespace-nowrap hover:bg-white/20 desktop:static desktop:mr-auto desktop:ml-2 [[hidden]]:hidden"><span aria-hidden="true">≈</span><span data-wave-label>Make waves</span></button>
  {{ end }}
  <nav class="desktop-nav hidden items-center gap-5 desktop:ml-auto desktop:flex min-[1100px]:gap-8" aria-label="Main navigation">
    <a class="inline-flex min-h-11 items-center text-[13px] hover:underline hover:underline-offset-[5px]" href="{{ site.Home.RelPermalink }}#work">Work <sup class="-mt-3 ml-1 font-mono text-[9px]">03</sup></a>
    <a class="inline-flex min-h-11 items-center text-[13px] hover:underline hover:underline-offset-[5px]" href="{{ site.Home.RelPermalink }}#about">About</a>
    <a class="inline-flex min-h-11 items-center text-[13px] hover:underline hover:underline-offset-[5px]" href="{{ site.Home.RelPermalink }}#archive">Writing</a>
  </nav>
  <div class="header-actions mr-2 ml-auto flex items-center gap-5 desktop:mx-0 min-[1100px]:gap-8">
    <span class="inline-flex h-11 w-11 shrink-0 items-center justify-center">
      <button hidden type="button" data-controller="theme" data-action="theme#toggle" aria-label="Switch color theme" class="theme-toggle inline-flex min-h-11 min-w-11 items-center justify-center text-[11px] desktop:text-[13px] [[hidden]]:hidden {{ if .IsHome }}text-white{{ else }}text-muted{{ end }}">Dark</button>
    </span>
    <a class="contact-link hidden min-h-11 items-center gap-7 rounded-[30px] border px-5 text-[13px] desktop:inline-flex {{ if .IsHome }}border-white bg-white text-[#1d3dce]{{ else }}border-line-strong{{ end }}" href="mailto:{{ site.Params.email }}">Say hello <span class="text-xl" aria-hidden="true">↗&#xFE0E;</span></a>
  </div>
  <details class="mobile-menu desktop:hidden" data-mobile-menu data-controller="menu" data-action="keydown@document->menu#closeOnEscape pointerdown@document->menu#closeOnOutsidePress">
    <summary class="flex min-h-11 cursor-pointer list-none items-center gap-3 text-xs [&::-webkit-details-marker]:hidden" data-menu-target="summary">Menu <span class="text-[22px]" aria-hidden="true">+</span></summary>
    <nav class="mobile-navigation absolute inset-x-0 top-19 rounded-2xl border border-line-strong bg-paper p-6 text-ink shadow-[0_12px_24px_#0002] [&_:focus-visible]:outline-ink [&_:focus-visible]:ring-paper" aria-label="Mobile navigation">
      <a class="flex min-h-14 items-center text-[28px] tracking-[-0.04em]" data-action="menu#follow" href="{{ site.Home.RelPermalink }}#work">Work</a>
      <a class="flex min-h-14 items-center text-[28px] tracking-[-0.04em]" data-action="menu#follow" href="{{ site.Home.RelPermalink }}#about">About</a>
      <a class="flex min-h-14 items-center text-[28px] tracking-[-0.04em]" data-action="menu#follow" href="{{ site.Home.RelPermalink }}#archive">Writing</a>
      <a class="flex min-h-14 items-center text-[28px] tracking-[-0.04em]" data-action="menu#follow" href="mailto:{{ site.Params.email }}">Say hello ↗&#xFE0E;</a>
    </nav>
  </details>
</header>
