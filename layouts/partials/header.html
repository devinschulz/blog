<header class="relative z-20 border-b border-line bg-paper">
  <div class="mx-auto grid h-16 max-w-350 grid-cols-[1fr_auto] items-center px-4.25 desktop:h-18 desktop:grid-cols-[1fr_auto_1fr] desktop:px-10">
    <a class="display justify-self-start text-[22px] tracking-[-0.04em]" href="{{ site.Home.RelPermalink }}" aria-label="Devin Schulz, home">Devin Schulz</a>
    <nav class="hidden gap-1 text-sm desktop:flex [&_a]:inline-flex [&_a]:min-h-11 [&_a]:items-center [&_a]:rounded-full [&_a]:px-3.5 [&_a]:text-muted [&_a]:transition-colors [&_a]:duration-200 [&_a:hover]:text-ink" aria-label="Main navigation">
      <a data-action="menu#follow" href="{{ site.Home.RelPermalink }}#states">State Shift</a>

      <a data-action="menu#follow" href="{{ site.Home.RelPermalink }}#archive">Archive</a>
    </nav>

        <a data-action="menu#follow" href="{{ site.Home.RelPermalink }}#states">State Shift</a>
        <a data-action="menu#follow" href="{{ site.Home.RelPermalink }}#work">Selected work</a>
        <a data-action="menu#follow" href="{{ site.Home.RelPermalink }}#archive">Archive</a>
        <a data-action="menu#follow" href="mailto:{{ site.Params.email }}">Say hello <span class="ml-1.5 text-accent" aria-hidden="true">↗&#xFE0E;</span></a>
      </nav>
    </details>
