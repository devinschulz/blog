{{ define "main" }}
<section class="reading-shell pb-8">
  <p class="label">404</p>
  <h1 class="mt-5 text-2xl leading-snug font-medium tracking-[-0.025em]">Page not found</h1>
  <p class="mt-8 max-w-[46ch] text-base leading-relaxed text-muted">Check the address, browse the writing archive, or return home.</p>
  <div class="mt-10 flex flex-wrap items-center gap-x-6 gap-y-3">
    <a class="inline-flex min-h-11 items-center text-sm text-accent underline underline-offset-4" href="{{ "blog/" | relURL }}">Browse all writing</a>
    <a class="arrow-link" href="{{ site.Home.RelPermalink }}">Back home <span aria-hidden="true">{{ partial "arrow-icon.html" (dict "direction" "up-right" "class" "h-4 w-4") }}</span></a>
  </div>

</section>
{{ end }}
