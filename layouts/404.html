{{ define "main" }}
<section class="mx-auto flex min-h-[70svh] max-w-350 flex-col justify-center px-4.25 py-20 desktop:px-10 desktop:py-28">
  <p class="label">404</p>
  <h1 class="display mt-6 max-w-[14ch] text-[clamp(3rem,13vw,4.5rem)] leading-[0.95] tracking-[-0.045em] desktop:text-[clamp(4.5rem,8vw,7rem)]">Page not found</h1>
  <p class="mt-8 max-w-[46ch] text-lg leading-relaxed text-muted">Check the address, browse the writing archive, or return home.</p>
  <div class="mt-10 flex flex-wrap items-center gap-x-6 gap-y-3">
    <a class="pill-solid" href="{{ "blog/" | relURL }}">Browse all writing</a>
    <a class="arrow-link" href="{{ site.Home.RelPermalink }}">Back home <span aria-hidden="true">{{ partial "arrow-icon.html" (dict "direction" "up-right" "class" "h-4 w-4") }}</span></a>
  </div>

</section>
{{ end }}
