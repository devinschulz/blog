{{ define "main" }}
  <section class="mx-auto max-w-350 px-4.25 py-16 desktop:px-10 desktop:py-28">
    <div class="max-w-[52rem]">
      <h1 class="display text-[clamp(2.6rem,11vw,3.5rem)] leading-[0.98] tracking-[-0.045em] desktop:text-[clamp(3.5rem,6vw,5.5rem)]">{{ .Title }}</h1>
      <p class="mt-6 max-w-[48ch] text-xl leading-relaxed text-muted">{{ .Description }}</p>
    </div>
    <div data-post-list class="shell mt-12 max-w-[60rem] desktop:mt-20"><div class="core p-2 desktop:p-3">
      {{ range .RegularPages.ByDate.Reverse }}
        {{ partial "post-row.html" . }}
      {{ end }}
    </div></div>
  </section>
{{ end }}
