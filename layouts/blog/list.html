{{ define "main" }}
  <section class="reading-shell pb-8" aria-labelledby="archive-title">
    <header class="archive-hero mb-7">
      <h1 id="archive-title" class="text-xl leading-snug font-medium tracking-[-0.02em]">Writing</h1>
    </header>
    {{ partial "writing-list.html" (dict "posts" .RegularPages) }}
    <div class="mt-6 flex flex-wrap gap-x-6 text-sm text-accent">
      <a class="inline-flex min-h-11 items-center underline underline-offset-4" href="{{ "tags/" | relURL }}">Browse tags</a>
      {{ with .OutputFormats.Get "RSS" }}<a class="inline-flex min-h-11 items-center underline underline-offset-4" href="{{ .RelPermalink }}">RSS feed</a>{{ end }}
    </div>
  </section>
{{ end }}
